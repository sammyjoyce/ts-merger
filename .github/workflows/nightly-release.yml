name: Nightly Release

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: write
  packages: write
  actions: write

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      nightly_version: ${{ steps.version.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Version
        id: version
        shell: bash
        run: |
          # Try to get the latest version from build.zig.zon
          version=$(grep '\.version = ' build.zig.zon | cut -d'"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT

          # Generate nightly version with timestamp
          timestamp=$(date -u +"%Y%m%d")
          echo "nightly_version=${version}-nightly.${timestamp}" >> $GITHUB_OUTPUT

      - name: Check for code changes
        id: check
        shell: bash
        run: |
          # Get the latest nightly release tag
          LATEST_NIGHTLY=$(git tag -l "*-nightly.*" | sort -V | tail -n1 || echo "")

          if [ -z "$LATEST_NIGHTLY" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # No previous nightly release exists or manual trigger
            echo "No previous nightly release found or manual trigger. Running release."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # Check for changes in code files since last nightly
            CHANGES=$(git diff --name-only $LATEST_NIGHTLY...HEAD -- '*.zig' '*.ts' '*.js' '*.py' || echo "")

            if [ -n "$CHANGES" ]; then
              echo "Changes detected since last nightly release:"
              echo "$CHANGES"
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "No code changes since last nightly release."
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi

  release:
    needs: check_changes
    if: needs.check_changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Installation Scripts
        run: python3 .github/scripts/build_scripts.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set Up Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Cache Zig Dependencies
        uses: actions/cache@v3
        with:
          path: |
            pkg/tree-sitter
            pkg/tree-sitter-typescript
            ~/.cache/zig
          key: ${{ runner.os }}-zig-pkg-${{ hashFiles('build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-pkg-

      - name: Clone tree-sitter
        if: steps.cache-tree-sitter-dependencies.outputs.cache-hit != 'true'
        run: |
          mkdir -p pkg
          git clone --depth 1 --branch v0.20.8 https://github.com/tree-sitter/tree-sitter.git pkg/tree-sitter

      - name: Clone tree-sitter-typescript
        if: steps.cache-tree-sitter-typescript-dependencies.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.20.1 https://github.com/tree-sitter/tree-sitter-typescript.git pkg/tree-sitter-typescript

      - name: Run Tests
        run: zig build test

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Create Nightly Tag
        run: |
          NIGHTLY_VERSION="${{ needs.check_changes.outputs.nightly_version }}"
          git tag -a "${NIGHTLY_VERSION}" -m "Nightly release ${NIGHTLY_VERSION}"
          git push origin "${NIGHTLY_VERSION}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config .goreleaser.nightly.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.check_changes.outputs.nightly_version }}
